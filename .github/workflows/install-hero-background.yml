name: Install new hero background

on:
  push:
    paths:
      - ".tmp-hero/READY"

permissions:
  contents: write

jobs:
  install-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild uploaded WebP
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp-hero/part*.b64 | base64 --decode > src/assets/images/heromainbg.webp
          echo "9cd5508faae3c2427eb09cf9b3bd3177613d27531bd8c086c344893009c9a09b  src/assets/images/heromainbg.webp" | sha256sum --check -

      - name: Point all hero backgrounds at the new asset
        shell: bash
        run: |
          set -euo pipefail
          for f in             src/index.html             src/content/pages/about.html             src/content/pages/services.html             src/content/pages/contact.html             src/content/pages/faq.html
          do
            sed -i 's#/assets/images/hero\.webp?v=20261006b#/assets/images/heromainbg.webp?v=20261008#g' "$f"
          done

      - name: Remove old hero assets and temporary installer
        shell: bash
        run: |
          set -euo pipefail
          rm -f src/assets/images/hero.webp src/assets/images/hero-small.webp
          rm -rf .tmp-hero
          rm -f .github/workflows/install-hero-background.yml

      - name: Commit installed hero
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace site hero background" || exit 0
          git push
